services:
  - type: web
    name: learnalytics
    runtime: docker
    repo: https://github.com/hina-rsk/Learnalytics.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "true"
