server {
    listen 10000;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 50M;

    # Serve static files directly
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|pdf|doc|docx|ppt|pptx|xls|xlsx)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Main location - try files, then directories, then route to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to config directory from web
    location ~ ^/config/ {
        deny all;
    }

    # Deny access to migration/setup scripts
    location ~ ^/(setup|seed|run_migration|run_schema|run_quiz_migration|run_quiz_builder_migration|check_|fix_|verify_).*\.php$ {
        deny all;
    }
}
